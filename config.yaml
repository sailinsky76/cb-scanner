# ============ 低容量套利扫描器 · 配置 ============
# 改这里即可，不用动代码。删掉某项或留空 → 回落 scanner/config.py 里的内置默认值。
# 注意：config.yaml 解析失败时会静默改用内置默认值，所以两边应保持一致。

capital: 100000        # 单账户可用资金(元)，用于占用/贡献估算
accounts: 1            # 参与打新的账户数
lookahead_days: 10     # 打新/配债 向前看多少天

# ---- 数据源开关（临时关掉某个源可设 false）----
sources:
  cb_ipo: true         # 可转债打新
  cb_allotment: true   # 配债一手党
  cb_redeem: true      # 转债退出提醒（最后交易日）
  fund_premium: true   # LOF/QDII 折溢价
  event_arb: true      # 事件套利公告
  cb_approved: true    # 转债获批公告（批文已下、发行公告还没出的那一段）

# ---- 可转债打新 ----
cb_ipo:
  min_rating: ""       # 例 "AA-"：只提示评级≥该档；留空=不按评级过滤
  min_convert_value: 0 # 转股价值下限，0=不过滤（<90 会自动打破发风险 flag）
  pay_window_trading_days: 2   # 缴款提醒提前几个**交易日**。注意是交易日不是日历天：
                               # 写日历天的话，周五跑覆盖到周日，下周一的缴款日会漏掉。
                               # 【v5.9.2】窗口改走 trading_window_end()：新浪交易日历
                               # 只排到当年年底，跨年那几天原来会回落成「跳周末」、把
                               # 元旦当成交易日 —— 实测 12-30 跑算出的窗口终点是
                               # 2027-01-01（元旦当天），01-04 的缴款日落在窗外。
                               # 现在日历盖不住时会多开 3 个工作日并在栏目级说出来，
                               # 那几天栏里多一两条是**预期行为**，不是 bug
  list_window_trading_days: 2  # 【v5.0】上市提醒提前几个**交易日**。
                               # 上市日是打新这条线上唯一需要你做判断的一天（卖还是留），
                               # 而 v4 的工具把你推进仓位之后就再也不提这只债了。
                               # 上面两道门（min_rating / min_convert_value）不套在
                               # 这一条上：那是"要不要申购"的判据，债已经在手里了，
                               # 不该因为评级低就不提醒你它今天上市。
                               # 这一条只报**时点**，不报价格 —— 工具不产出"合理价值"
                               # 那类没有出处的估值数，想要参照请自己去查近期新债
                               # 首日涨幅的实际分布

# ---- 转债退出提醒（v5.1）----
cb_redeem:
  exit_window_trading_days: 5  # 最后交易日向前看几个**交易日**。
                               # 和缴款/上市那两个窗口一样是交易日不是日历天：
                               # 写日历天的话，周五跑覆盖到周日，下周一要停止交易的
                               # 那只债会漏掉 —— 而漏掉的代价是这只债你卖不掉了。
  show_past: true              # 最后交易日已经过去的还出不出条。
                               # true = 出，归观察档，提醒你核对持仓里还有没有它；
                               # false = 报告更干净，但你自己得记住。
  past_lookback_days: 10       # 「已过」那一档往回看几天，避免翻出半年前摘牌的
  max_unknown: 20              # 「在表内但最后交易日未取到」那一档最多列几条。
                               # 超了只截断展示，**总数照说**。
  unknown_ratio_gate: 0.5      # 【v5.1】「日期为空」占全表的比例超过这个数，就当成
                               # 这张表的**常态**而不是异常：那一档一条都不逐行印，
                               # 改在栏目级说清「几行有日期 / 几行为空 / 空不等于
                               # 没在赎回」。
                               # 出处：docs/probes/probe2.txt 实测 08-10 那天 319 行里只有 6 行
                               # 带最后交易日，其余 313 行（98%）是空的 —— 空不是
                               # 「日期丢了」，是「这只债还没有最后交易日」。
                               # 按代码排序截 20 条的后果离线复演过：印出来的是代码
                               # 最小那批噪音，而这一档本来要救的春23(113667)/
                               # 应流(113697) 恰好被截在配额外面。
                               # 调到 1.0 = 关掉这条口子（回到 v5.1-rc 的截断行为）。
  #
  # 【这一版做不到的事，写在这里免得下次忘】
  # 这张表把**强赎**和**自然到期摘牌**放在同一列「最后交易日」里，两者的
  # 处置方向相反（强赎是限期离场否则按赎回价了结，到期是拿本息）。
  # `diag_redeem2.py` 已经跑过（docs/probes/probe2.txt）：**退出码 1 —— 分不开**。
  # 不是缺列，是样本一边倒：6 行有日期的债到期日全都紧贴最后交易日（间隔 4-6 天，
  # 都是自然到期形态），远期那一组 0 行，没法验证「强赎状态」的字面意思和
  # 间隔证据对不对得上。「强赎状态」的取值探明了（空 263 / 公告不强赎 48 /
  # 已公告强赎 6 / 公告要强赎 2），但探明取值 ≠ 可以拿它下判断。所以本栏：
  #   · 措辞一律用「最后交易日」，不给任何一只债贴「强赎」或「到期」的标签；
  #   · 到期日一并印出来，你拿两个原始日期自己看；
  #   · 「强赎天计数」原样透传，不解析（'12/15 | 30' 会被解析成 0001-12-15），
  #     只在透传前删掉集思录的 HTML 标签（实测这一列会带 <span>/<br>）。
  # 复探条件：等某天这张表里出现「有最后交易日、且离到期还有几年」的债 ≥2 只，
  # 再跑一次 `python diag_redeem2.py` —— 那时远期组才够样本。

# ---- 转债获批公告（v5.9）----
cb_approved:
  window_days: 180     # 巨潮公告检索窗口（日历天）。实测 180 天约 22 只转债获批。
                       # **别为了让这一栏有货去放宽它**：窗口越大越容易撞上服务端
                       # 整页封顶（3000 条），而封顶的表现形式是「静默地少给」。
  max_items: 30        # 【v5.9.1 语义改了】只管「**已发行**」那一档，0=不限。
                       # 「未查到发行记录 / 未核对」的一条都不砍，砍掉几只照说。
                       # 为什么不是全栏配额：排序按获批日期倒序、截断留最新的，
                       # 砍掉的就永远是最老的；而下面 stale_days 那一档按定义
                       # 就是最老的那批 —— 两个方向对着干，stale 结构性地必被砍光。
                       # v5.9-rc 实盘 08-12 就这么翻了车：命中 50 只印 30 只，
                       # 栏目级写着「1 只获批已满 90 天…一条都没过滤」，而那一只
                       # 在被砍的 20 只里，报告里根本找不到。
                       # 副作用：未发行的多到超过这个数时本栏会超长 —— 那时会在
                       # 栏目级说出来，宁可长也不静默少给。
  stale_days: 90       # 获批满这么多天、转债总表里还查不到它 → 标一句。
                       # **只标事实不给原因**：已发但总表没收录 / 在等发行窗口 /
                       # 真的中止，这三种本工具分不开，写「可能中止」就是拿推断当结论。
                       # 一条都不过滤，标出来让你自己看。
                       # 【v5.9.1】标题写「向特定对象发行 / 购买资产」的**不计入**：
                       # 定向可转债不面向公众，bond_zh_cov 里本来就不会有它，
                       # 它的「未查到发行记录」是结构性的，不是「批文下来这么久
                       # 还没动静」。混进来这个数会越攒越大，而这个数本来是要你
                       # 回头看一眼的信号。它照样出条、照样标出来，只是不计这个数。
  hide_issued: false   # 已发行的要不要从本栏隐去。
                       # false（默认）= 留着并标出「已发行（债券代码，申购日）」——
                       #   它是有用的事实：这条获批线索已经走完，不用再等。
                       # true = 隐去，报告更短，但**隐了几只会在栏目级照说**。
                       # 为什么默认不隐：发没发只能按**正股代码**回配 bond_zh_cov，
                       # 而一家公司可以有转2/转3。已经加了一道收窄（只认申购日不早于
                       # 获批日的那只），但它挡不住同窗口内的另一只债；总表取不到时
                       # 更是一只都判不了 —— 那时候隐去等于静默清零（纪律 5）。
  keywords:            # 整体替换，不与默认值求并集（写了就是全量）
                       # 2023 年全面注册制之后批文叫「同意注册」/「注册批复」，
                       # 「核准」两条留着兼容老写法（实测命中 0-11 条）。
    - "同意注册"
    - "注册批复"
    - "证监会核准"
    - "核准批复"
  # 反向写法（不予注册/终止/中止/撤回/失效）**故意不做配置项**：它是标题分类的
  # 顺序，反向组必须先判 —— 顺序反了，「注册批复到期失效」会被当成获批印出来，
  # 而那个方向的代价是照着一只已经黄了的债去埋伏正股。

# ---- 配债一手党（原股东优先配售）----
cb_allotment:
  max_prior_return_pct: 30   # 正股"发债前三个月涨幅"上限，超过标红(抢权风险)
  prior_window_days: 95      # 日历天≈3个月
  # 说明：这栏只在"股权登记日 ∈ [今天, 今天+lookahead_days]"时出条。
  # 登记日要等发行公告才有值，通常只提前 2-3 个交易日 → 多数日子为 0 条属正常。
  # v4.4 起 0 条会自己说明是哪种 0（真空窗 / 登记日取不到 / 列位移），
  # 不用再去底部健康面板对"扫描 N 行"。长期一次都不中就跑 diag_allotment.py。
  #
  # 【v5.0】两处口径改了，都**没有**做成配置项：
  # ① 最小配售单位按债券代码前缀分市场——沪市(11x/118x) 1 手 = 10 张 = 1000 元面值，
  #    深市(12x) 1 张 = 100 元面值。v4.6.1 及以前两市统一按 1000 元算，
  #    深市转债的"需持股/占用市值"被放大了 10 倍。这是交易所规则不是偏好，
  #    做成可调项等于给了改错的机会。
  # ② 新增"含权量(%)"= 每股配售额 ÷ 正股价，以及行内那句
  #    "正股每跌1%，需上市溢价X%才打平"(= 100 ÷ 含权量)。两个都是算术恒等式。
  #    加它不是为了多个卖点——这一栏做的正是"发行公告后抢权"这件被反复说会亏钱的事，
  #    含权量是把风险量化出来的**警告标签**。详见报告末尾"口径与假设"。

# ---- LOF/QDII 折溢价 ----
fund_premium:
  premium_alert_pct: 3.0     # 溢价率≥该值 → 出条（规避清单）
  discount_alert_pct: 2.0    # 折价率≥该值 → 出条（可能动手的一侧）
  only_cross_border: false   # true=只看跨境；false=境内也扫(靠阈值天然过滤，常年±0.2%)
  max_premium: 10            # 溢价侧最多列几条（0=不限）
  max_discount: 10           # 折价侧最多列几条（0=不限）—— 两侧分开配额，
                             # 否则十几条 10%+ 的溢价会把 3-5% 的折价全挤掉
  # ---- 折价能不能兑现：成本与流动性 ----
  redeem_fee_pct: 1.5        # 赎回费假设(%)。1.5 是持有不足 7 日的**监管下限**，多数基金
                             # 就按这个收；持有满 7 日通常降到 0.5 上下。报告里的「扣费后」
                             # 用它算，**实际以基金合同费率表为准**——这一栏是提醒你去查，
                             # 不是替代查。想按长持口径看就改成 0.5
  commission_pct: 0.03       # 场内买入佣金(%)。基金无印花税，双边合计通常 0.02-0.05
  min_turnover_wan: 100      # 日成交额低于该值(万元)就打流动性提示，不过滤。
                             # 算法：单笔建仓别超过日成交额的 5%，否则自己把折价买没。
                             # 本金 10 万、单只放 1-2 万 → 日成交额得有 20-40 万才够，
                             # 100 万是留了余量的舒适线，按你的实际下单量调
  spread_alert_pct: 0.5      # 买卖价差占最新价超过该比例就提示（冷门 LOF 常见 1%+）
                             # 注意：价差已经**折进「净收益(%)」**里了（买入价按卖一算），
                             # 这一项只管要不要额外印一句话，不影响数值

  # ---- 折价值多少钱：仓位上限 ----
  turnover_participation_pct: 5   # 单笔建仓最多占日成交额的百分之几。5% 是估算惯例，
                             # 不是硬规则；冷门 LOF 真按 5% 去吃单也会打穿好几档盘口，
                             # 所以「预估(元)」是乐观值。调小=更保守
  max_position_pct: 30       # 单只最多占本金的百分之几。默认 30：本金 10 万 → 单只 3 万，
                             # 而这笔交易要扛一天净值波动（权益类 LOF 日波动 1% 量级
                             # ≈ ±300 元），对上 1.98% 的净收益 ≈ 600 元，大约 2:1。
                             # 想更分散就调到 15-20，但小额那几条会更不值得动手
  min_profit_yuan: 0         # 预估收益低于该值(元)的折价不出条。0=不过滤。
                             # 想少看几条就调这里，**别去提 discount_alert_pct**：
                             # 08-08 实测，提到 3.0% 会砍掉 506005（折价 2.27% 但
                             # 一天成交 1575 万、能放满仓位、预估 222 元），却留下
                             # 161131（折价 3.65%、卖一吃掉一半、预估 81 元）。
                             # 设 100 的话那天 9 条会只剩 4 条，且留下的是对的 4 条

  demote_unknown_gate: true   # 申赎状态取不到的条目要不要往后排。
                             # true（默认）= 排在「可兑现」之后。ETF 那两路接口
                             # 根本不返回申赎状态，跨境 ETF 全部落在这一档，所以
                             # 开着它，溢价侧前几名会让给「申购确认开放」的境内 LOF，
                             # 那张高溢价规避清单会短两三只。
                             # false = 排序回到 v4.5 的样子（只按幅度）。
                             # **无论开关怎么设，计数与动作词都不会把「没取到」
                             # 说成「可兑现」** —— 那是错，不是偏好。

  delist_line_wan: 1000      # 场内资产净值低于该值(万元)就打退市线提示。依据 2026-08-07
                             # 沪深交易所 LOF 退出机制征求意见稿：连续 60 个交易日
                             # 场内资产净值 < 1000 万应终止上市，小规模这类不设过渡期。
                             # 数据源是深交所日频份额 × 单位净值 —— **只覆盖深市**
                             # （160-169 段），沪市 501/502/505/506 拿不到，不标记
                             # 不等于安全。且是单日快照，不是连续 60 日

  only_redeemable: false     # true=赎回/申购暂停的品种整条不出。默认 false：定开产品的
                             # 折价虽然做不了，但它是「这只票为什么便宜」的解释，留着有用
  sanity_median_pct: 3.0     # LOF 折溢价**中位数**偏离 0 超过该值 → 判定净值口径不对，写 error。
                             # 境内 LOF 常态折溢价很小（实测中位数 -0.59%），整体偏移只可能是
                             # 取错了净值列。注意这道门抓不住「换成前一日净值」(实测偏 +0.35%)，
                             # 那种错靠代码里的净值列白名单挡
  stale_days: 3              # 数据日期落后超过几个**交易日** → 打"数据陈旧"flag
                             # （用交易日算，否则每个周一都会误报陈旧）
  fetch_retries: 3           # 行情接口失败重试次数，退避 2s/5s。
                             # 注意：如果三次都在相同耗时上以相同方式失败，那不是限流，
                             # 是这个 host 在你的网络下不通 —— 重试再多也没用，
                             # 跑 python diag_sources.py 确认
  jisilu_cookie: ""          # 留空即可。集思录 T-1 估值口径，仅在"要做折价端"或
                             # "要跨基金横向比溢价"时才需要；填的话建议改走环境变量
                             # JISILU_COOKIE，避免 cookie 随项目 zip 外流

# ---- 事件套利（巨潮公告关键词）----
event_arb:
  window_days: 7
  max_items: 20              # 最多列几条（0=不限）。基金栏目是全市场检索，
                             # 退市潮里「终止上市」一天几十条，不封顶会把日报冲垮
  keywords:                  # 整体替换，不与默认值求并集（写了就是全量）
    - "要约收购"
    - "现金选择权"
    - "换股吸收合并"
    - "吸收合并"
  fund_keywords:             # 走巨潮**「基金」栏目**（keywords 走的是「沪深京」）。
                             # 两个库不通：拿默认栏目搜「终止上市」一条都搜不到，
                             # 而且和「今天没有」长得一模一样。
                             # 对应 2026-08-07 沪深交易所 LOF 退出机制征求意见稿：
                             # 商品期货/QDII LOF 最晚 2027-12-31 终止上市；
                             # 连续 60 个交易日场内资产净值 < 1000 万的 LOF 也应终止。
                             # 故意没放「基金份额持有人大会」和「转型」——太常见，会刷屏
    - "终止上市"
    - "基金合同终止"
    - "投资者选择期"

# ---- 输出 ----
output:
  formats: ["console", "html"]   # 可选 console / markdown / html，可多选
  out_dir: "./reports"
